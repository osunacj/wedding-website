<!-- countdown -->
<section id="countdown">
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-8 col-lg-offset-2 text-center">
                <p class="countdown-intro great-vibes-regular">Counting down</p>
                <div class="countdown" data-countdown-target="2027-05-29T16:00:00">
                    <div class="countdown-item">
                        <span class="countdown-value" data-unit="months">00</span>
                        <span class="countdown-label">Months</span>
                    </div>
                    <div class="countdown-sep">&middot;</div>
                    <div class="countdown-item">
                        <span class="countdown-value" data-unit="days">00</span>
                        <span class="countdown-label">Days</span>
                    </div>
                    <div class="countdown-sep">&middot;</div>
                    <div class="countdown-item">
                        <span class="countdown-value" data-unit="hours">00</span>
                        <span class="countdown-label">Hours</span>
                    </div>
                    <div class="countdown-sep">&middot;</div>
                    <div class="countdown-item">
                        <span class="countdown-value" data-unit="minutes">00</span>
                        <span class="countdown-label">Minutes</span>
                    </div>
                    <div class="countdown-sep">&middot;</div>
                    <div class="countdown-item">
                        <span class="countdown-value" data-unit="seconds">00</span>
                        <span class="countdown-label">Seconds</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
