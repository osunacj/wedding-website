upstream app_server_djangoapp {
    server localhost:8000 fail_timeout=0;
}

server {
    listen 8080;
    server_name localhost;

    access_log  /var/log/nginx/wedding-access.log;
    error_log  /var/log/nginx/wedding-error.log info;

    keepalive_timeout 5;

    root /app;

    location /static {
        autoindex on;
        alias /app/static_root;
    }

    # TLS is terminated upstream (e.g. Cloud Run), which reports the original
    # scheme in X-Forwarded-Proto. Absent locally, so plain-HTTP dev still works.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Host $http_host;
        proxy_redirect off;

        if (!-f $request_filename) {
            proxy_pass http://app_server_djangoapp;
            break;
        }
    }
}