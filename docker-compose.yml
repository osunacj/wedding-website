
services:
  # WARNING: If you want to use this docker-compose file in production, you need to backup your database!
  postgres:
    container_name: postgres-wedding
    image: postgres
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
  wedding:
    container_name: wedding
    build: .
    ports:
      - 8080:8080
    depends_on:
      - postgres

volumes:
  postgres-data: